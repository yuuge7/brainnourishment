name: Publish Android release

on:
  workflow_run:
    workflows: [Android build]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: publish-android-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This workflow has write access. Never check out or execute PR code here.
      - name: Check out trusted publishing tooling from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Download only the package from the completed build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release-${{ github.event.workflow_run.run_attempt }}
          path: build/release-to-publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify source, generate changelog, and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tool/release.py publish --artifacts build/release-to-publish
